<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة حركة الأظرف الرجالية</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:#152847;font-family:Tahoma,Arial,sans-serif;text-align:center}.page{max-width:520px;min-height:100vh;margin:auto;padding:25px 15px 45px;background:linear-gradient(145deg,#fffdf7,#eef3fb);border:6px double #bd984f;box-shadow:0 4px 30px #172c4a33}.brand{font-size:13px;color:#63708b;animation:drop .7s both}.title{border:2px solid #c4a363;border-radius:22px;margin:16px 8px;padding:20px 5px;color:#142b4b;background:#fff;box-shadow:0 8px 15px #172d4b17;animation:drop .8s .15s both}.title h1{margin:0;font-size:27px}.name{margin:18px auto 23px;background:#fff;border:1px solid #c9a86a;border-radius:14px;padding:12px;animation:drop .7s .3s both}.name input{border:0;border-bottom:1px solid #c9a86a;font:inherit;max-width:58%;outline:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 8px}.item{border:0;background:transparent;cursor:pointer;color:#fff;min-width:0;animation:rise .65s both}.number{font-size:12px;color:#8d6a32;margin-bottom:6px}.envelope{height:95px;position:relative;border-radius:8px;background:linear-gradient(130deg,#233f68,#0d2341);box-shadow:0 6px 10px #102a4b40;border:2px solid #c8a66a;perspective:500px}.flap{position:absolute;inset:0 0 auto;height:55%;background:#34557d;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s ease;z-index:2}.letter{position:absolute;left:12%;right:12%;top:22%;height:70%;background:#fff5dc;border:1px solid #d8b66f;border-radius:5px;transition:transform .6s .12s;z-index:1;color:#152b4c;font-size:20px;padding-top:8px}.item.open .flap{transform:rotateX(175deg)}.item.open .letter{transform:translateY(-28px)}.item.open .envelope{box-shadow:0 0 18px #d3a751}.item label{display:block;font-size:11px;line-height:1.5;color:#172c4c;margin-top:8px;font-weight:bold}.hint{font-size:12px;margin:24px auto;color:#59677c}.reset{background:#172e51;color:white;border:0;border-radius:20px;padding:12px 25px;font:inherit}@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes drop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style><main class="page"><div class="brand">معاينة تفاعلية • النسخة الرجالية</div><header class="title"><h1>ملف الأداء الوظيفي</h1><div>تجربة حركة ظهور وفتح الأظرف</div></header><div class="name">اسم المعلم: <input placeholder="للتجربة فقط"></div><section class="grid" id="grid"></section><p class="hint">اضغط على أي ظرف لمشاهدة حركة الفتح، ثم اضغط مرة أخرى لإغلاقه. هذه معاينة للحركة فقط وليست قالب التوزيع النهائي.</p><button class="reset" onclick="location.reload()">إعادة عرض الحركة</button></main><script>const names=['أداء الواجبات الوظيفية','التفاعل مع المجتمع المهني','التفاعل مع أولياء الأمور','التنوع في استراتيجيات التدريس','تحسين نتائج المتعلمين','خطة أنشطة المختبر','المعرفة بالأسس الفنية','توفير مستلزمات التجارب','السلامة المهنية','تجهيز المختبر','تسليم الأجهزة وتخزينها','تقرير أنشطة المختبر','تقارير حالة الأجهزة','الدورات','التطوع'];document.querySelector('#grid').innerHTML=names.map((s,i)=>'<button class="item" style="animation-delay:'+(0.45+i*.075)+'s" onclick="this.classList.toggle(\'open\')" aria-label="فتح '+s+'"><div class="number">'+(i+1)+'</div><div class="envelope"><div class="letter">✦</div><div class="flap"></div></div><label>'+s+'</label></button>').join('')</script></html>
