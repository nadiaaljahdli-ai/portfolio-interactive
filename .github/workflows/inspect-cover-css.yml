name: Inspect cover CSS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-cover-css.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('cover-css-report.txt').write_text(s[:7000]+'\n---COVER-INPUT---\n'+s[s.find("if(n===1)"):s.find("if(n===1)")+650])
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cover-css-report.txt
          git diff --cached --quiet || git commit -m "Inspect exact cover field positioning"
          git push
