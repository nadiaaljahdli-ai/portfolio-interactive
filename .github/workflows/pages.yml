name: Deploy interactive portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fix sidebar overlay on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'box-shadow:0 0 0 100vmax #0008;transform:translateX(110%)'
          new = 'box-shadow:none;transform:translateX(110%)'
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('.nav.open{transform:translateX(0)}', '.nav.open{transform:translateX(0);box-shadow:0 0 0 100vmax #0008}', 1)
          import re
          inject = '<link rel="stylesheet" href="evidence-storage.css?v=14"><link rel="stylesheet" href="print-fix.css?v=8"><script src="evidence-storage.js?v=16" defer></script>'
          s, count = re.subn(r'</body\s*>', lambda m: inject + m.group(0), s, count=1, flags=re.I)
          if count != 1:
              s, count = re.subn(r'</html\s*>', lambda m: inject + m.group(0), s, count=1, flags=re.I)
          if count != 1:
              raise SystemExit('HTML insertion point missing; refusing incomplete deployment')
          import re as _re
          # Diagnostic excerpt for identifying the original print and evidence rules.
          css='\n'.join(_re.findall(r'<style[^>]*>(.*?)</style>',s,flags=_re.I|_re.S))
          lines=css.splitlines()
          matches=[(i,l) for i,l in enumerate(lines) if any(t in l.lower() for t in ['@media print','.slot','.paper','@page','print()'])]
          out='\n'.join(str(i+1)+': '+l[:900] for i,l in matches[:130])
          Path('print-diagnostics.txt').write_text(out[:20000],encoding='utf-8')
          print('ORIGINAL_CSS_START')
          for j in range(0,min(len(css),12000),350): print('CSSCHUNK',j,repr(css[j:j+350]))
          print('ORIGINAL_CSS_END')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
