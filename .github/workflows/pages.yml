name: Deploy interactive portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fix sidebar overlay on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'box-shadow:0 0 0 100vmax #0008;transform:translateX(110%)'
          new = 'box-shadow:none;transform:translateX(110%)'
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('.nav.open{transform:translateX(0)}', '.nav.open{transform:translateX(0);box-shadow:0 0 0 100vmax #0008}', 1)
          import re
          inject = '<link rel="stylesheet" href="evidence-storage.css?v=13"><link rel="stylesheet" href="print-fix.css?v=1"><script src="evidence-storage.js?v=13" defer></script>'
          s, count = re.subn(r'</body\s*>', lambda m: inject + m.group(0), s, count=1, flags=re.I)
          if count != 1:
              s, count = re.subn(r'</html\s*>', lambda m: inject + m.group(0), s, count=1, flags=re.I)
          if count != 1:
              raise SystemExit('HTML insertion point missing; refusing incomplete deployment')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
