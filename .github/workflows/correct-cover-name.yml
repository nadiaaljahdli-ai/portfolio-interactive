name: Correct male cover name editing
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/correct-cover-name.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          s=s.replace('<script src="./trainee-identity.js" defer></script>','')
          import re
          s=re.sub(r'<script src="\./cover-font-controls\.js(?:\?v=[^\"]*)?" defer></script>', '', s)
          tag='<script src="./cover-font-controls.js?v=20261116-12" defer></script>'
          assert '</body>' in s
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s)
          assert tag in p.read_text()
          assert '<script src="./trainee-identity.js" defer></script>' not in p.read_text()
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove identity overlay and enable cover font adjustment"
          git push
