<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ملف الشواهد والإنجاز الإلكتروني</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#e8edf4;color:#102746;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px;background:#d8b45f;color:#0b2444;font-weight:700}button:active{transform:scale(.97)}header{position:sticky;top:0;z-index:10;background:#0a2342;color:white;padding:10px;display:flex;gap:9px;align-items:center;box-shadow:0 3px 12px #0002}header strong{flex:1;font-size:clamp(12px,3vw,17px)}.small{font-size:12px;padding:9px}.nav{position:fixed;z-index:20;right:0;top:0;bottom:0;width:min(82vw,340px);background:#fff;box-shadow:0 0 0 100vmax #0008;transform:translateX(110%);transition:transform .2s;overflow:auto;padding:18px}.nav.open{transform:translateX(0)}.nav button{display:block;width:100%;margin:5px 0;text-align:right;background:#edf1f7}.nav .close{background:#d8b45f}.container{max-width:850px;margin:auto;padding:14px}.notice{background:white;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.8;margin:8px 0 22px}.page-block{margin:0 auto 28px;scroll-margin-top:75px}.page-name{font-size:14px;margin:0 0 8px}.paper{position:relative;width:min(100%,650px);margin:auto;aspect-ratio:210/297;background:white;box-shadow:0 3px 15px #0002}.paper>img.base{display:block;width:100%;height:100%}.cover-name{position:absolute;bottom:6.4%;left:30%;width:42%;height:3.3%;background:transparent;border:0;text-align:center;font-weight:700;color:#0b2444;font-size:clamp(9px,2vw,15px);outline:1px dashed #d8b45f}.cover-name:focus{background:#fff9}.slot{position:absolute;top:35.2%;width:39%;height:27%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6%;background:transparent}.slot.right{right:6%}.slot.left{left:6%}.slot .placeholder{background:#ffffffdc;padding:8px 5px;font-size:clamp(9px,2vw,13px);border:1px dashed #c7a45b;border-radius:6px;text-align:center}.slot img{max-width:100%;max-height:100%;object-fit:contain}.slot.empty .placeholder{display:block}.slot:not(.empty) .placeholder{display:none}.toolbar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px 0}.toolbar button{font-size:12px}.links{margin:8px auto;max-width:650px;display:flex;gap:8px;flex-wrap:wrap}.links a{color:#0b417b;background:white;padding:8px;border-radius:6px;font-size:12px}.hide{display:none}.page-num{text-align:center;font-size:11px;color:#5c6e84;margin:5px}.save-msg{font-size:11px;color:#f4d18a} @media print{header,.nav,.notice,.toolbar,.page-name,.page-num,.links{display:none!important}body,.container{background:white;margin:0;padding:0}.page-block{margin:0;break-after:page;page-break-after:always}.paper{box-shadow:none;width:210mm;height:297mm;max-width:none}.slot.empty{display:none}.cover-name{outline:0}@page{size:A4 portrait;margin:0}}
</style></head><body><header><button id="menu" class="small">☰ الفهرس</button><strong>ملف الشواهد والإنجاز الإلكتروني</strong><button id="save" class="small">حفظ</button><button id="print" class="small">PDF</button></header><aside id="nav" class="nav"><button id="close" class="close">إغلاق ✕</button><h3>الفهرس الجانبي</h3><div id="navitems"></div></aside><main class="container"><div class="notice">النسخة التجريبية: مرري للأعلى لتصفح الصفحات الأصلية. اضغطي داخل الإطار الذهبي لإضافة صورة، أو استخدمي «تكرار الصفحة» لإضافة صفحة شواهد جديدة. يتم الحفظ على هذا الجهاز فقط؛ استخدمي «PDF» للحصول على نسخة قابلة للمشاركة.</div><div id="pages"></div></main><input type="file" id="upload" accept="image/*" hidden><script>
const titles=["الغلاف", "المقدمة", "الرؤية والرسالة والقيم", "الأهداف", "سياسة التعليم", "أهمية توثيق الشواهد", "رؤية ٢٠٣٠ والقيادة", "ميثاق أخلاقيات التعليم", "بنود توثيق الشواهد", "١- أداء الواجبات الوظيفية", "٢- التفاعل مع المجتمع المهني", "٣- التفاعل مع أولياء الأمور", "٤- التنوع في استراتيجيات التدريس", "٥- تحسين نتائج المتعلمين", "٦- خطة يومية لأنشطة المختبر", "٧- المعرفة بالأسس والمفاهيم الفنية", "١٣- تقارير حالة الأجهزة والمعدات", "٨- توفير مستلزمات التجارب", "٩- السلامة المهنية", "١٠- تحضير وتجهيز المختبر", "١١- تهيئة وتسليم الأجهزة", "١٢- التقرير الأسبوعي", "الخاتمة"];let state={};let counter=0;let activeSlot=null;const evidence=new Set(Array.from({length:13},(_,i)=>i+10));const pages=document.getElementById('pages');const nav=document.getElementById('nav');
function makePage(n,dup=false,id=null){let key=id||('p'+n+'-'+(++counter));let sec=document.createElement('section');sec.className='page-block';sec.id=key;sec.dataset.n=n;sec.dataset.duplicate=dup?'1':'0';let h=document.createElement('h3');h.className='page-name';h.textContent=titles[n-1]+(dup?' (صفحة إضافية)':'');sec.append(h);let paper=document.createElement('div');paper.className='paper';let base=document.createElement('img');base.className='base';base.src='pages/'+String(n).padStart(2,'0')+'.jpg';base.alt=titles[n-1];paper.append(base);if(n===1){let name=document.createElement('input');name.className='cover-name';name.placeholder='اسم محضر المختبر';name.setAttribute('aria-label','اسم محضر المختبر');name.oninput=()=>save();paper.append(name)}if(evidence.has(n)){for(let side of ['right','left']){let slot=document.createElement('div');slot.className='slot '+side+' empty';slot.dataset.side=side;let hint=document.createElement('span');hint.className='placeholder';hint.textContent='+ إضافة صورة شاهد';slot.append(hint);slot.addEventListener('click',()=>{activeSlot=slot;document.getElementById('upload').click()});paper.append(slot)}}sec.append(paper);if(evidence.has(n)){let bar=document.createElement('div');bar.className='toolbar';let repeat=document.createElement('button');repeat.textContent='⊕ تكرار الصفحة';repeat.onclick=()=>{let c=makePage(n,true);sec.after(c);refreshNav();c.scrollIntoView({behavior:'smooth'});save()};bar.append(repeat);let link=document.createElement('button');link.textContent='🔗 إضافة رابط شاهد';link.onclick=()=>{let url=prompt('الصقي رابط الشاهد (https://)');if(!url)return;try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error();let a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='فتح رابط الشاهد';let holder=sec.querySelector('.links');if(!holder){holder=document.createElement('div');holder.className='links';sec.append(holder)}holder.append(a);save()}catch(e){alert('الرابط غير صالح')}};bar.append(link);if(dup){let del=document.createElement('button');del.textContent='🗑 حذف الصفحة المكررة';del.onclick=()=>{if(confirm('حذف هذه الصفحة المكررة؟')){sec.remove();refreshNav();save()}};bar.append(del)}sec.append(bar)}let num=document.createElement('div');num.className='page-num';num.textContent='الصفحة الأصلية '+n+' من ٢٣';sec.append(num);return sec}
function refreshNav(){let box=document.getElementById('navitems');box.innerHTML='';document.querySelectorAll('.page-block').forEach((sec)=>{let b=document.createElement('button');b.textContent=sec.querySelector('.page-name').textContent;b.onclick=()=>{nav.classList.remove('open');sec.scrollIntoView({behavior:'smooth'})};box.append(b)})}
for(let n=1;n<=23;n++)pages.append(makePage(n));refreshNav();document.getElementById('menu').onclick=()=>nav.classList.add('open');document.getElementById('close').onclick=()=>nav.classList.remove('open');document.getElementById('print').onclick=()=>window.print();document.getElementById('save').onclick=()=>{save();alert('تم طلب الحفظ على هذا الجهاز. يُنصح بتصدير PDF أيضًا.')};document.getElementById('upload').addEventListener('change',e=>{let f=e.target.files[0];if(!f||!activeSlot)return;if(f.size>12*1024*1024){alert('اختاري صورة أصغر من ١٢ ميغابايت');return}let reader=new FileReader();let slot=activeSlot;reader.onload=()=>{let source=new Image();source.onload=()=>{let ratio=Math.min(1,1400/Math.max(source.width,source.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(source.width*ratio));canvas.height=Math.max(1,Math.round(source.height*ratio));canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);let img=document.createElement('img');img.src=canvas.toDataURL('image/jpeg',0.76);img.alt='صورة الشاهد';slot.querySelectorAll('img').forEach(x=>x.remove());slot.append(img);slot.classList.remove('empty');save()};source.src=reader.result};reader.readAsDataURL(f);e.target.value=''});
function save(){try{let arr=[];document.querySelectorAll('.page-block').forEach(sec=>{let item={n:Number(sec.dataset.n),dup:sec.dataset.duplicate==='1',id:sec.id,images:{},links:[],name:sec.querySelector('.cover-name')?.value||''};sec.querySelectorAll('.slot img').forEach(im=>item.images[im.parentElement.dataset.side]=im.src);sec.querySelectorAll('.links a').forEach(a=>item.links.push(a.href));arr.push(item)});localStorage.setItem('portfolio-v1',JSON.stringify(arr))}catch(e){console.warn('تعذر الحفظ: قد تكون الصور كبيرة',e);alert('تعذر الحفظ في المتصفح. صدّري نسخة PDF الآن لحماية عملك.')}}
try{let saved=JSON.parse(localStorage.getItem('portfolio-v1')||'null');if(Array.isArray(saved)&&saved.length){pages.innerHTML='';for(let item of saved){if(!item||!Number.isInteger(item.n)||item.n<1||item.n>23)continue;let sec=makePage(item.n,!!item.dup,item.id);pages.append(sec);if(item.n===1&&sec.querySelector('.cover-name'))sec.querySelector('.cover-name').value=item.name||'';for(let [side,url] of Object.entries(item.images||{})){let slot=sec.querySelector('.slot.'+side);if(slot&&typeof url==='string'&&url.startsWith('data:image/')){let img=document.createElement('img');img.src=url;slot.append(img);slot.classList.remove('empty')}}for(let url of item.links||[]){try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))continue;let holder=sec.querySelector('.links');if(!holder){holder=document.createElement('div');holder.className='links';sec.append(holder)}let a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='فتح رابط الشاهد';holder.append(a)}catch(e){}}}refreshNav()}}catch(e){console.warn(e)}
</script></body></html>
