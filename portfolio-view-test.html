<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عرض ملف الإنجاز</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eef5;color:#0b2748;font-family:Tahoma,Arial,sans-serif;padding:18px}main{max-width:650px;margin:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 20px #0001}h1{font-size:23px}.card{border:1px solid #d8b45f;border-radius:12px;padding:16px}.meta{line-height:1.9}img{display:block;max-width:100%;height:auto;max-height:680px;object-fit:contain;margin:18px auto;border-radius:8px}.note{font-size:13px;color:#556}.err{background:#fff0f0;padding:12px;border-radius:8px}</style><main><h1>نسخة العرض</h1><div id="content">جارٍ تحميل الملف...</div></main><script>
const API="https://rzovpzlhqwyuerjapxjl.supabase.co/functions/v1/portfolio-share-api";
const out=document.getElementById("content"),id=new URLSearchParams(location.search).get("id");
(async()=>{
 try{
  if(!id)throw new Error("الرابط غير مكتمل");
  const r=await fetch(API+"?action=view&id="+encodeURIComponent(id));
  const data=await r.json();if(!r.ok)throw new Error(data.error||"تعذر تحميل الملف");
  out.replaceChildren();const card=document.createElement("section");card.className="card";
  const meta=document.createElement("div");meta.className="meta";
  const n=document.createElement("p");n.textContent="الاسم: "+(data.portfolio.owner_name||"");
  const t=document.createElement("p");t.textContent="الشاهد: "+(data.portfolio.title||"");
  meta.append(n,t);card.append(meta);
  for(const asset of (data.assets||[])){const img=document.createElement("img");img.src=asset.signed_url;img.alt="صورة الشاهد";img.loading="eager";card.append(img)}
  const note=document.createElement("p");note.className="note";note.textContent="هذه نسخة للعرض فقط. الصور محفوظة في تخزين خاص ويُنشأ لها وصول مؤقت عند فتح الصفحة.";
  card.append(note);out.append(card);
 }catch(e){out.className="err";out.textContent="تعذر فتح نسخة العرض: "+e.message}
})();</script></html>
