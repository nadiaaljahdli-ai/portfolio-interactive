<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نشر ملف الإنجاز</title><style>body{background:#edf0f5;color:#17304b;font:16px Tahoma,Arial;margin:0;padding:20px}main{max-width:700px;background:white;margin:auto;padding:24px;border-radius:15px}label{display:block;margin:14px 0 6px;font-weight:bold}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7c2d1;border-radius:8px;font:inherit}button{background:#173c63;color:white;border:0;border-radius:9px;padding:13px 20px;margin-top:15px;font:inherit}button:disabled{opacity:.5}.item{padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:12px}a{overflow-wrap:anywhere}p{line-height:1.8}.notice{background:#fff6dd;padding:12px;border-radius:8px}</style><main><h1>نشر شواهد ملف الإنجاز</h1><p class="notice">هذه أداة نشر مستقلة للتجربة، ولا تستورد الصور المحفوظة تلقائيًا داخل قالب ملف الإنجاز الأصلي. لا ترفعي بيانات شخصية أو صورًا حساسة أثناء الاختبار. كل من يملك رابط العرض يستطيع مشاهدة محتواه.</p><label>نوع النسخة</label><select id="template"><option value="male">رجالية</option><option value="female">نسائية</option></select><label>الاسم</label><input id="owner" maxlength="80"><label>المدرسة</label><input id="school" maxlength="120"><label>عنوان الملف</label><input id="title" maxlength="120" value="ملف الشواهد والإنجاز"><label>صور الشواهد (يمكن اختيار عدة صور)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="items"></div><button id="publish">نشر نسخة العرض</button><div id="result" aria-live="polite"></div></main><script>
const api="https://rzovpzlhqwyuerjapxjl.supabase.co/functions/v1/portfolio-share-api",by=id=>document.getElementById(id),items=by("items");let files=[];
by("photos").onchange=()=>{files=Array.from(by("photos").files);items.replaceChildren();files.forEach((f,i)=>{const div=document.createElement("div");div.className="item";const p=document.createElement("p");p.textContent=f.name+" ("+(f.size/1048576).toFixed(1)+" MB)";const l=document.createElement("label");l.textContent="رقم الصفحة";const n=document.createElement("input");n.type="number";n.min="1";n.max="99";n.value="1";n.id="page"+i;div.append(p,l,n);items.append(div)})};
by("publish").onclick=async()=>{const btn=by("publish"),result=by("result");if(!by("owner").value.trim()||!files.length){result.textContent="أدخلي الاسم واختاري الصور";return}if(files.length>100||files.some(f=>f.size>5242880)){result.textContent="الحد الأقصى ١٠٠ صورة، و٥ ميغابايت للصورة";return}const form=new FormData();form.append("template",by("template").value);form.append("owner_name",by("owner").value.trim());form.append("school_name",by("school").value.trim());form.append("title",by("title").value.trim());form.append("data",JSON.stringify({fields:{}}));files.forEach((f,i)=>{form.append("image",f);form.append("image_key","page-"+Math.max(1,Math.min(99,Number(by("page"+i).value)||1))+":slot-"+i)});btn.disabled=true;result.textContent="جارٍ رفع الصور وحفظ الملف…";try{const r=await fetch(api+"?action=create-full",{method:"POST",body:form});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||"فشل النشر");result.replaceChildren();const p=document.createElement("p");p.textContent="تم إنشاء رابط عرض يحتوي على "+x.asset_count+" صورة:";const a=document.createElement("a");a.href=x.view_url;a.textContent=x.view_url;a.target="_blank";const copy=document.createElement("button");copy.textContent="نسخ رابط العرض";copy.onclick=()=>navigator.clipboard.writeText(x.view_url);result.append(p,a,document.createElement("br"),copy);sessionStorage.setItem("portfolio-edit-"+x.share_id,x.edit_token)}catch(e){result.textContent="تعذر النشر: "+e.message}finally{btn.disabled=false}};
</script></html>
