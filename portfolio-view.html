<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عرض ملف الإنجاز المشترك</title><style>body{margin:0;background:#edf0f6;color:#172c45;font:16px Tahoma,Arial}main{max-width:850px;margin:24px auto;background:white;border-radius:15px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:25px}h2{font-size:19px;border-bottom:1px solid #ddd;padding-bottom:12px}.meta{line-height:2}.page{padding:15px;border:1px solid #ded6c4;border-radius:12px;margin:18px 0;break-inside:avoid}img{display:block;max-width:100%;max-height:900px;object-fit:contain;margin:12px auto}.error{color:#a32}button{padding:10px 18px;background:#17395c;color:white;border:0;border-radius:8px}@media print{body{background:white}main{box-shadow:none;margin:0;padding:0}button{display:none}.page{break-inside:avoid}}</style><main><h1>ملف الشواهد والإنجاز — نسخة العرض</h1><div id="status">جارٍ تحميل الملف…</div><div id="root"></div><button onclick="print()" hidden id="print">طباعة نسخة العرض</button></main><script>
const api="https://rzovpzlhqwyuerjapxjl.supabase.co/functions/v1/portfolio-share-api",root=document.getElementById("root"),status=document.getElementById("status");
function el(tag,text,parent){const x=document.createElement(tag);if(text!==null)x.textContent=text;parent.append(x);return x}
(async()=>{try{const id=new URLSearchParams(location.search).get("id");if(!/^[A-Za-z0-9_-]{16}$/.test(id||""))throw Error("رابط المشاركة غير صالح");const r=await fetch(api+"?action=view&id="+encodeURIComponent(id));const v=await r.json();if(!r.ok||!v.ok)throw Error("تعذر العثور على الملف المنشور");const p=v.portfolio;el("p","الاسم: "+(p.owner_name||"—"),root);el("p","المدرسة: "+(p.school_name||"—"),root);el("p","النسخة: "+(p.template==="female"?"نسائية":"رجالية"),root);if(p.title)el("p","العنوان: "+p.title,root);const d=p.data||{};if(d.fields&&typeof d.fields==="object"){const section=el("section",null,root);el("h2","البيانات",section);for(const [k,val] of Object.entries(d.fields)){if(typeof val==="string"&&val.trim())el("p",k+" : "+val,section)}}const groups=new Map();for(const a of v.assets||[]){if(!groups.has(a.page_key))groups.set(a.page_key,[]);groups.get(a.page_key).push(a)}for(const [key,assets] of groups){const s=el("section",null,root);s.className="page";el("h2","الصفحة: "+key,s);for(const a of assets){const img=el("img",null,s);img.src=a.signed_url;img.alt="شاهد "+a.slot_key;img.loading="lazy"}}if(!groups.size)el("p","لا توجد صور شواهد مرفوعة في هذا الملف.",root);status.textContent="نسخة عرض فقط — لا تتضمن أدوات تعديل.";document.getElementById("print").hidden=false}catch(e){status.className="error";status.textContent=e.message}})();
</script></html>
