<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نسخة احتياطية لملف الإنجاز</title><style>body{font:16px Tahoma,Arial;background:#edf1f6;color:#123;padding:24px}main{max-width:650px;margin:auto;background:white;border-radius:16px;padding:24px}button{background:#123456;color:white;border:0;padding:14px;border-radius:9px;font:inherit}p{line-height:1.9}</style><main><h2>نسخة احتياطية لملف الإنجاز</h2><p>احفظي نسخة من بيانات الصفحات والصور الموجودة في هذا المتصفح قبل أي تعديل. لا تُرفع البيانات إلى خادم، ولا تتغير صفحات الملف الأصلية.</p><button id="download">تنزيل النسخة الاحتياطية</button><p id="status" role="status"></p></main><script>document.getElementById('download').onclick=()=>{const keys=['portfolio-v1','portfolio-male-extras-v1'];let data={version:1,created:new Date().toISOString(),origin:location.origin,items:{}};for(const key of keys){const value=localStorage.getItem(key);if(value)data.items[key]=JSON.parse(value)}if(!Object.keys(data.items).length){document.getElementById('status').textContent='لا توجد بيانات محفوظة في هذا المتصفح.';return}const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='portfolio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='تم تجهيز النسخة الاحتياطية للتنزيل. احتفظي بها في مكان خاص لأنها قد تحتوي على بيانات وصور.'}</script></html>
