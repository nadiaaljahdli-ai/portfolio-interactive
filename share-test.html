<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة مشاركة ملف الإنجاز</title><style>body{font-family:Tahoma,Arial;background:#edf2f8;color:#112b4b;margin:0;padding:24px}main{max-width:580px;margin:auto;background:white;padding:22px;border-radius:18px;box-shadow:0 6px 20px #0001}h1{font-size:23px}label{display:block;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #abb8ca;border-radius:8px;box-sizing:border-box}button{background:#0b315c;color:white;border:0;padding:13px;border-radius:9px;margin-top:16px;font-weight:bold}#result{margin-top:18px;overflow-wrap:anywhere}img{max-width:100%;max-height:320px;margin-top:15px;border-radius:8px}.note{background:#fff6e2;padding:12px;border-radius:8px;font-size:14px;line-height:1.8}a{overflow-wrap:anywhere}</style><main><h1>تجربة مشاركة ملف الإنجاز</h1><p class="note">هذه صفحة اختبار مستقلة، وليست ملف الإنجاز الأصلي. لا تُدخلي بيانات حقيقية أو صورًا خاصة. الهدف التأكد من فتح رابط عرض على جهاز آخر دون تسجيل دخول.</p><section id="editor"><label>اسم تجريبي</label><input id="name" placeholder="مثال: متدرب تجريبي"><label>عبارة تجريبية</label><input id="evidence" placeholder="مثال: شاهد إنجاز"><button id="make">إنشاء رابط عرض تجريبي</button><div id="result"></div></section><section id="viewer" hidden><h2>نسخة العرض التجريبية</h2><p id="displayName"></p><p id="displayEvidence"></p><p>هذه نسخة للعرض فقط، دون أدوات تعديل.</p></section></main><script>function encode(s){return btoa(unescape(encodeURIComponent(s)))}function decode(s){return decodeURIComponent(escape(atob(s)))}if(location.hash.startsWith('#view=')){try{let x=JSON.parse(decode(location.hash.slice(6)));document.getElementById('editor').hidden=true;document.getElementById('viewer').hidden=false;document.getElementById('displayName').textContent='الاسم: '+String(x.n||'');document.getElementById('displayEvidence').textContent='الشاهد: '+String(x.e||'')}catch(e){document.getElementById('viewer').textContent='تعذر فتح رابط العرض'}}document.getElementById('make').onclick=()=>{let n=document.getElementById('name').value.trim(),e=document.getElementById('evidence').value.trim();if(!n||!e){alert('اكتبي الاسم والعبارة التجريبية');return}let url=location.href.split('#')[0]+'#view='+encode(JSON.stringify({n,e}));let box=document.getElementById('result');box.replaceChildren();let p=document.createElement('p');p.textContent='رابط العرض جاهز. افتحيه على جهاز آخر:';let a=document.createElement('a');a.href=url;a.textContent=url;let b=document.createElement('button');b.textContent='نسخ رابط العرض';b.onclick=()=>navigator.clipboard.writeText(url).then(()=>alert('تم النسخ')).catch(()=>prompt('انسخي الرابط:',url));box.append(p,a,document.createElement('br'),b)};</script></html>
