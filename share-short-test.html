<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار النشر القصير</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#102e50;font-family:Tahoma,Arial,sans-serif;padding:20px}main{max-width:650px;margin:auto;background:white;padding:24px;border-radius:20px}h1{font-size:24px}label{display:block;margin-top:18px;font-weight:bold}input,select{display:block;width:100%;padding:14px;margin-top:8px;border:1px solid #aebdd0;border-radius:9px;font:inherit}button{border:0;border-radius:10px;background:#0d3159;color:white;font:inherit;padding:14px;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}.note{background:#fff4d9;padding:14px;line-height:1.8;border-radius:10px}#status{overflow-wrap:anywhere;line-height:2;margin-top:15px}a{overflow-wrap:anywhere}</style><main><h1>اختبار نشر شاهد برابط قصير</h1><p class="note">تجربة منفصلة عن القالب الأصلي. استخدمي بيانات وصورة تجريبية غير حساسة. تُحفظ الصورة على خادم خاص ولا تُضمّن داخل الرابط. لا تُدخلي بيانات طالبات حقيقية.</p><form id="form"><label>الاسم<input name="owner_name" required maxlength="80" value="نادية"></label><label>عنوان الشاهد<input name="title" required maxlength="120" value="ملف الإنجاز"></label><label>نوع القالب<select name="template"><option value="female">نسائي</option><option value="male">رجالي</option></select></label><label>صورة تجريبية<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><button id="send" type="submit">نشر وإنشاء رابط قصير</button></form><div id="status" role="status" aria-live="polite"></div></main><script>const API="https://rzovpzlhqwyuerjapxjl.supabase.co/functions/v1/portfolio-share-api";const f=document.getElementById("form"),s=document.getElementById("status"),b=document.getElementById("send");f.onsubmit=async e=>{e.preventDefault();const file=f.elements.image.files[0];if(!file||file.size>5*1024*1024){s.textContent="اختاري صورة أصغر من ٥ ميغابايت";return}b.disabled=true;s.textContent="جارٍ رفع الصورة وإنشاء الرابط...";try{const r=await fetch(API+"?action=create",{method:"POST",body:new FormData(f)});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||"تعذر النشر");const url=new URL("portfolio-view-test.html",location.href);url.searchParams.set("id",x.share_id);s.replaceChildren();const p=document.createElement("p");p.textContent="تم حفظ الشاهد على الخادم. رابط العرض:";const a=document.createElement("a");a.href=url.href;a.textContent=url.href;a.target="_blank";const copy=document.createElement("button");copy.type="button";copy.textContent="نسخ الرابط";copy.onclick=async()=>{try{await navigator.clipboard.writeText(url.href);alert("تم النسخ")}catch{prompt("انسخي الرابط",url.href)}};s.append(p,a,document.createElement("br"),copy)}catch(err){s.textContent="تعذر النشر: "+err.message+" — لم يتم تأكيد حفظ الصورة."}finally{b.disabled=false}};</script></html>
